name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak project.zip
        run: |
          mkdir -p src
          unzip -q project.zip -d src
          D=$(dirname "$(find src -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
          echo "Proyek: $D"; ls "$D"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraToolsTS-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/**/*.apk
